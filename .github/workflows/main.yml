name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: validation-${{ github.workflow }}-${{ github.ref }}-changes
      cancel-in-progress: true
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      migrations: ${{ steps.filter.outputs.migrations }}
      http: ${{ steps.filter.outputs.http }}
      webrtc: ${{ steps.filter.outputs.webrtc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/protocol/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
            web:
              - 'apps/web/**'
              - 'packages/core/**'
              - 'packages/shared/**'
              - 'packages/storage/**'
              - 'package.json'
              - 'bun.lock'
            migrations:
              - 'apps/api/migrations/**'
            http:
              - 'apps/api/**'
              - 'apps/node/**'
              - 'apps/web/src/lib/pipeline.ts'
              - 'packages/core/**'
              - 'packages/protocol/**'
              - 'packages/shared/**'
              - 'packages/storage/**'
              - 'integration/five-node-http-cluster.test.ts'
              - 'package.json'
              - 'bun.lock'
            webrtc:
              - 'apps/api/**'
              - 'apps/node/**'
              - 'apps/web/src/lib/pipeline.ts'
              - 'apps/web/src/lib/webrtc-peer.ts'
              - 'packages/protocol/**'
              - 'packages/shared/**'
              - 'packages/storage/**'
              - 'integration/webrtc-chromium.test.ts'
              - 'package.json'
              - 'bun.lock'

  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: validation-${{ github.workflow }}-${{ github.ref }}-bun
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun test apps packages
      - run: bun run typecheck
      - run: bun run build:web
      - run: bun run build:api

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: validation-${{ github.workflow }}-${{ github.ref }}-go
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/node/go.mod
          cache-dependency-path: apps/node/go.sum
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o horcrux-node-ci ./cmd/horcrux-node

  windows-node-storage:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/node
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/node/go.mod
          cache-dependency-path: apps/node/go.sum
      - run: go test ./internal/storage ./internal/identity ./internal/server
      - run: go build -o horcrux-node.exe ./cmd/horcrux-node

  five-node-http:
    needs: [changes, bun, go]
    if: needs.changes.outputs.http == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: validation-${{ github.workflow }}-${{ github.ref }}-five-node-http
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/node/go.mod
          cache-dependency-path: apps/node/go.sum
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test:five-node

  webrtc:
    needs: [changes, bun, go]
    if: needs.changes.outputs.webrtc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: validation-${{ github.workflow }}-${{ github.ref }}-webrtc
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/node/go.mod
          cache-dependency-path: apps/node/go.sum
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test:webrtc
        env:
          HORCRUX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}

  migrate-api:
    needs: [changes, bun, go, five-node-http, webrtc]
    if: >-
      always() && needs.changes.outputs.migrations == 'true' &&
      needs.bun.result == 'success' && needs.go.result == 'success' &&
      needs.five-node-http.result == 'success' && needs.webrtc.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-d1-migrations
    concurrency:
      group: production-d1-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun --cwd apps/api wrangler d1 migrations apply horcrux-file-system --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    needs: [changes, bun, go, five-node-http, webrtc, migrate-api]
    if: >-
      always() && needs.changes.outputs.api == 'true' &&
      needs.bun.result == 'success' && needs.go.result == 'success' &&
      (needs.five-node-http.result == 'success' || needs.five-node-http.result == 'skipped') &&
      (needs.webrtc.result == 'success' || needs.webrtc.result == 'skipped') &&
      (needs.migrate-api.result == 'success' || needs.migrate-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-d1-migrations
    concurrency:
      group: production-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun --cwd apps/api wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    needs: [changes, bun, go, five-node-http, webrtc]
    if: >-
      always() && needs.changes.outputs.web == 'true' &&
      needs.bun.result == 'success' && needs.go.result == 'success' &&
      (needs.five-node-http.result == 'success' || needs.five-node-http.result == 'skipped') &&
      (needs.webrtc.result == 'success' || needs.webrtc.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-d1-migrations
    concurrency:
      group: production-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: |
          test -n "$VITE_API_URL"
          test "$VITE_HORCRUX_STORAGE_MODE" = http || test "$VITE_HORCRUX_STORAGE_MODE" = webrtc
          bun run build:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_HORCRUX_STORAGE_MODE: ${{ vars.VITE_HORCRUX_STORAGE_MODE }}
      - run: bun --cwd apps/api wrangler pages deploy ../web/dist --project-name horcruxfs --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
